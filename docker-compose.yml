# Harmony ↔ Discord bridge, run it yourself.
#
#   1. Fill in the three values below (see README.md, "Run it yourself").
#   2. docker compose up -d
#   3. docker compose logs -f
#
# HARMONY_SETUP_CODE is used once. After the first start the bridge keeps its
# credentials in the harmony-bridge volume; the line can be removed.
services:
  harmony-bridge:
    image: ghcr.io/y4my4my4m/harmony-discord-bridge:latest
    container_name: harmony-bridge
    restart: unless-stopped
    environment:
      HARMONY_URL: "https://har.mony.lol"
      HARMONY_SETUP_CODE: "HB-XXXX-XXXX-XXXX"
      DISCORD_TOKEN: "paste-your-discord-bot-token-here"
      # LOG_LEVEL: "info"   # error | warn | info | debug (debug prints message contents)
      # MAX_UPLOAD_MB: "8"   # files up to this size per message are uploaded to Discord; larger ones become links
    volumes:
      - harmony-bridge:/data

  # Legacy bridge-config.yml (v1) setups: drop the environment block above and
  # mount the old folders instead. Bind-mounted folders must be writable by
  # uid 1000 (sudo chown -R 1000:1000 config data).
  #   volumes:
  #     - ./config:/app/config
  #     - ./data:/app/data

volumes:
  harmony-bridge:
