name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify Docker image builds
        run: docker build -t harmony-discord-bridge:ci .
      - name: Unconfigured container exits with instructions
        run: |
          set +e
          out=$(docker run --rm harmony-discord-bridge:ci 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q HARMONY_URL
